# gk-harness usage: Prometheus scrapes the usage-ledger receiver (127.0.0.1:4318/metrics) and
# Grafana shows the "gk-harness usage" dashboard. Installed root-owned in /etc/gk-grafana/ and run
# only through `gkh grafana up|down|status` (README.md). Both containers use host networking and
# listen on 127.0.0.1 only. Data sits in Docker named volumes, so the stack comes back after a
# reboot without the LUKS unlock. Image tags are pinned exactly; Stage 4 may bump them with Carl.
name: gk-grafana

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:9090
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=400d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana-oss:11.3.0
    network_mode: host
    restart: unless-stopped
    # GF_SECURITY_ADMIN_PASSWORD, written at setup (root, mode 0600) and never printed.
    env_file: grafana.env
    environment:
      - GF_SERVER_HTTP_ADDR=127.0.0.1
      - GF_SERVER_HTTP_PORT=3300
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
