name: ci

on:
  push:
  pull_request:

jobs:
  py:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-22.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Agents match routes.json
        if: matrix.os == 'ubuntu-latest'
        run: python install.py gen --check

  wf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Workflow tests
        shell: bash
        run: |
          if compgen -G "tests/workflows/*.test.mjs" > /dev/null; then
            node --test tests/workflows/
          else
            echo "No tests/workflows/*.test.mjs yet; skipping."
          fi
