# gk-harness usage: Prometheus scrapes the usage-ledger receiver (127.0.0.1:4318/metrics) and
# Grafana shows the "gk-harness usage" dashboard. Installed root-owned in /etc/gk-grafana/ and run
# only through `gkh grafana up|down|status` (README.md). Both containers use host networking and
# listen on 127.0.0.1 only. Data sits in Docker named volumes. On this box Docker's data-root is
# /srv/gkdata/docker, on the LUKS volume, and docker.service starts only after `gk-data unlock`;
# so after a reboot the stack comes back by itself only once `sudo gk-data unlock` (or the
# automatic unlock) has run and Docker is up. Image tags are pinned exactly and never pulled by
# compose (its pull policy is never): the pull is an explicit `sudo docker pull` on Carl's go.
name: gk-grafana

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    pull_policy: never
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:9090
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=400d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana-oss:11.3.0
    pull_policy: never
    network_mode: host
    restart: unless-stopped
    # GF_SECURITY_ADMIN_PASSWORD, written at setup (root, mode 0600) and never printed.
    env_file: grafana.env
    environment:
      - GF_SERVER_HTTP_ADDR=127.0.0.1
      - GF_SERVER_HTTP_PORT=3030
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      # Nothing leaves the machine. Each setting below exists in Grafana 11.3.0's
      # conf/defaults.ini, where it defaults to calling grafana.com or gravatar.com.
      - GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED=true
      - GF_PLUGINS_PLUGIN_ADMIN_ENABLED=false
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SNAPSHOTS_EXTERNAL_ENABLED=false
      # A guard by construction: any outbound HTTP(S) a setting above missed goes to a proxy
      # on the discard port, which refuses it. Loopback (the Prometheus data source) is exempt.
      - HTTP_PROXY=http://127.0.0.1:9
      - HTTPS_PROXY=http://127.0.0.1:9
      - NO_PROXY=127.0.0.1,localhost
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
